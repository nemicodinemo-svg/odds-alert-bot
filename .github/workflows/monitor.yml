name: Odds Monitor

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      # ✅ PASSO CRUCIALE AGGIUNTO: Scarica lo stato precedente (quote vecchie)
      - name: Download previous state
        uses: actions/download-artifact@v4
        with:
          name: odds-state
        continue-on-error: true  # Permette di continuare se è il primo lancio e il file non esiste

      - name: Run monitor
        run: python odds_monitor.py
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # ✅ Salva lo stato nuovo (quote attuali) per il giro successivo
      - name: Upload state
        uses: actions/upload-artifact@v4
        with:
          name: odds-state
          path: |
            odds_state.json
            odds_monitor.log
          retention-days: 7
          overwrite: true
