name: Odds Monitor

on:
  workflow_dispatch:

# ✅ Aggiungi questi permessi
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run monitor
        run: python odds_monitor.py
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # ✅ Salva lo stato nel repository (commit automatico)
      - name: Commit and push state
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add odds_state.json
          git diff --staged --quiet || git commit -m "📊 Update odds state $(date +%Y-%m-%d_%H:%M)"
          git push
        continue-on-error: true
