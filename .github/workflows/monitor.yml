name: Odds Monitor
on:
  schedule:
    # 🟢 PICCO (11:00-21:00 ITA → 09:00-19:00 UTC) → Ogni 30 min
    - cron: '0,30 9-19 * * *'
    #  SERA (21:00-24:00 ITA → 19:00-22:00 UTC) → Ogni 1 ora
    - cron: '0 19-21 * * *'
    #  NOTTE (00:00-11:00 ITA → 22:00-09:00 UTC) → Ogni 2 ore
    - cron: '0 0,2,4,6,8,22 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install requests
        run: pip install requests
      - name: Run monitor
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python odds_monitor.py
      - name: Upload state
        uses: actions/upload-artifact@v4
        with:
          name: odds-state
          path: |
            odds_state.json
            odds_monitor.log
          retention-days: 2
          if-no-files-found: ignore
